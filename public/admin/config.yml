backend:
  name: github
  repo: DegreeAmin/peaceful-planet
  branch: main
  base_url: https://sveltia-cms-auth.sveltia.dev
  auth_endpoint: /auth

# Boleh kekalkan local_backend untuk ujian tempatan
local_backend: true

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "string" }
      - { label: "Publish Date", name: "pubDate", widget: "datetime" }
      - { label: "Body", name: "body", widget: "markdown" }